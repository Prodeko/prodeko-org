<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Proleko? – lisää lehti</title>
<!--
  The Proleko? upload for the magazine's editor-in-chief, at prodeko.org/admin/proleko/.

  Sign-in is the same popup Decap uses (cms.prodeko.org/auth), so the same
  Prodeko account works, and a session already open in /admin is reused. The
  account needs the website editor roles or the Proleko roles
  (PROLEKO_ROLES in the proxy). The upload goes to cms.prodeko.org/proleko/issues,
  which puts the PDF on the server and commits the cover and a data file; see
  proxy/internal/proleko.

  The cover is the PDF's first page, rendered here in the browser with pdf.js
  (pinned, like Decap), so the proxy's container needs no PDF tools.
-->
<style>
  :root { --navy: #002851; --blue: #0053a0; --muted: #5b6b85; --line: #d4dbe8; --ok: #1a6b3c; --err: #a4243b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #000a14; background: #f6f6f6; }
  header { background: var(--navy); color: #fff; padding: 1.25rem 1rem; text-align: center; }
  header p { margin: 0; font-family: Georgia, serif; }
  header h1 { margin: .1rem 0 0; font: 700 clamp(2rem, 7vw, 3rem)/1 Georgia, serif; text-transform: uppercase; }
  main { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  .card { background: #fff; border: 1px solid var(--line); padding: 1.25rem; margin-bottom: 1.25rem; }
  h2 { font-size: 1.15rem; margin: 0 0 .75rem; color: var(--navy); }
  label { display: block; font-weight: 600; margin: .9rem 0 .25rem; }
  .hint { font-weight: 400; color: var(--muted); font-size: .9rem; }
  input[type=text], input[type=number] { width: 100%; padding: .55rem .6rem; font: inherit; border: 1px solid #9aa7bd; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  button { font: inherit; font-weight: 600; padding: .65rem 1.2rem; border: 0; background: var(--navy); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  button.secondary { background: #fff; color: var(--navy); border: 1px solid var(--navy); }
  .cover-preview { display: flex; gap: 1rem; align-items: flex-start; margin-top: .75rem; }
  .cover-preview img { width: 140px; aspect-ratio: 707/1000; object-fit: cover; border: 1px solid var(--line); background: #eef1f6; }
  .notice { padding: .75rem 1rem; border-left: 4px solid var(--blue); background: #eef3fa; margin-top: 1rem; }
  .ok { border-color: var(--ok); background: #eaf5ee; }
  .err { border-color: var(--err); background: #fbeef0; }
  progress { width: 100%; height: 1rem; margin-top: 1rem; }
  [hidden] { display: none !important; }
  a { color: var(--blue); }
  .who { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <p>Tuotantotalouden killan kiltalehti</p>
  <h1>Proleko?</h1>
</header>
<main>
  <section class="card" id="signin">
    <h2>Kirjaudu</h2>
    <p>Lehden lisääminen vaatii Prodeko-tunnuksen, jolla on Proleko?-päätoimittajan
      tai sivuston ylläpitäjän oikeudet.</p>
    <button type="button" id="login">Kirjaudu Prodeko-tunnuksella</button>
    <p id="signin-msg" class="notice err" hidden></p>
  </section>

  <form class="card" id="form" hidden>
    <div class="who">
      <h2>Lisää tai päivitä lehti</h2>
      <button type="button" class="secondary" id="logout">Kirjaudu ulos</button>
    </div>
    <div class="row">
      <div>
        <label for="year">Vuosi</label>
        <input type="number" id="year" name="year" min="1990" required>
      </div>
      <div>
        <label for="number">Numero <span class="hint">(esim. 3, kun lehti on 3/2026)</span></label>
        <input type="number" id="number" name="number" min="1" max="20" required>
      </div>
    </div>
    <p id="exists" class="notice" hidden></p>

    <label for="title">Lehden nimi <span class="hint">(esim. Joulu-Proleko?; voi jättää tyhjäksi)</span></label>
    <input type="text" id="title" name="title" maxlength="120">

    <label for="pdf">PDF <span class="hint">(verkkoversio, enintään 200 Mt)</span></label>
    <input type="file" id="pdf" accept="application/pdf,.pdf">

    <label for="cover">Kansikuva <span class="hint">(vapaaehtoinen: oletuksena PDF:n ensimmäinen sivu)</span></label>
    <input type="file" id="cover" accept="image/jpeg,image/png,image/webp">

    <div class="cover-preview" id="preview" hidden>
      <img id="preview-img" alt="Kansikuvan esikatselu">
      <p class="hint" id="preview-text"></p>
    </div>

    <p style="margin-top:1.5rem"><button type="submit" id="submit">Tallenna lehti</button></p>
    <progress id="progress" max="100" value="0" hidden></progress>
    <p id="result" class="notice" hidden></p>
  </form>

  <p class="hint">Proleko?-sivut: <a href="/fi/palvelut/proleko/">prodeko.org/fi/palvelut/proleko</a> ·
    muu sivuston muokkaus: <a href="/admin/">/admin</a></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  'use strict';
  // The proxy. The same address as base_url in /admin/config.yml.
  var PROXY = 'https://cms.prodeko.org';
  var PROVIDER = 'github';
  var TOKEN_KEY = 'proleko-upload-token';

  var $ = function (id) { return document.getElementById(id); };
  var token = null;
  var issues = [];
  var renderedCover = null; // Blob of the PDF's first page
  var thisYear = new Date().getFullYear();
  $('year').value = thisYear;
  $('year').max = thisYear + 1;

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  function show(el, text, kind) {
    el.textContent = text;
    el.className = 'notice' + (kind ? ' ' + kind : '');
    el.hidden = false;
  }

  // A Decap session in this browser is the same token; reuse it so an editor
  // who is already signed in to /admin is not asked again.
  function storedToken() {
    try {
      var t = sessionStorage.getItem(TOKEN_KEY);
      if (t) return t;
      var decap = JSON.parse(localStorage.getItem('decap-cms-user') || 'null');
      if (decap && decap.token) return decap.token;
    } catch (e) { /* storage blocked: sign in instead */ }
    return null;
  }

  function signedIn(t) {
    token = t;
    try { sessionStorage.setItem(TOKEN_KEY, t); } catch (e) {}
    $('signin').hidden = true;
    $('form').hidden = false;
  }

  function signedOut(message) {
    token = null;
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
    $('form').hidden = true;
    $('signin').hidden = false;
    if (message) show($('signin-msg'), message, 'err');
  }

  // Decap's popup handshake (proxy/internal/auth/handshake.go): the popup says
  // "authorizing:github", we answer the same, and it then sends the token.
  $('login').addEventListener('click', function () {
    $('signin-msg').hidden = true;
    var popup = window.open(PROXY + '/auth?provider=' + PROVIDER + '&site_id=prodeko.org&scope=repo',
      'proleko-signin', 'width=520,height=680');
    function onMessage(e) {
      if (e.origin !== PROXY || e.source !== popup || typeof e.data !== 'string') return;
      if (e.data === 'authorizing:' + PROVIDER) {
        popup.postMessage(e.data, e.origin);
        return;
      }
      var ok = 'authorization:' + PROVIDER + ':success:';
      var bad = 'authorization:' + PROVIDER + ':error:';
      if (e.data.indexOf(ok) === 0) {
        window.removeEventListener('message', onMessage);
        signedIn(JSON.parse(e.data.slice(ok.length)).token);
        popup.close();
      } else if (e.data.indexOf(bad) === 0) {
        window.removeEventListener('message', onMessage);
        var m = 'Kirjautuminen epäonnistui.';
        try { m = JSON.parse(e.data.slice(bad.length)).message || m; } catch (x) {}
        show($('signin-msg'), m, 'err');
      }
    }
    window.addEventListener('message', onMessage);
  });

  $('logout').addEventListener('click', function () { signedOut(); });

  // The archive as the site last built it, to say when a number exists.
  fetch('/fi/palvelut/proleko/lehdet.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (list) { issues = list; checkExisting(); })
    .catch(function () {});

  function current() {
    var y = parseInt($('year').value, 10), n = parseInt($('number').value, 10);
    for (var i = 0; i < issues.length; i++) {
      if (issues[i].year === y && issues[i].number === n) return issues[i];
    }
    return null;
  }

  function checkExisting() {
    var found = current();
    if (!found) { $('exists').hidden = true; return; }
    show($('exists'), 'Numero ' + found.number + '/' + found.year +
      (found.title ? ' (' + found.title + ')' : '') + ' on jo arkistossa. ' +
      'Tallentaminen korvaa sen tiedot. Jos vaihdat vain nimen tai kannen, PDF:ää ei tarvitse valita uudelleen.');
    if (!$('title').value) $('title').value = found.title || '';
  }
  $('year').addEventListener('input', checkExisting);
  $('number').addEventListener('input', checkExisting);

  function previewBlob(blob, text) {
    $('preview-img').src = URL.createObjectURL(blob);
    $('preview-text').textContent = text;
    $('preview').hidden = false;
  }

  // Render page one of the PDF to a 1000 px wide JPEG.
  $('pdf').addEventListener('change', function () {
    renderedCover = null;
    var file = $('pdf').files[0];
    if (!file) return;
    if (!window.pdfjsLib) {
      if (!$('cover').files[0]) previewBlob(new Blob(), 'Kantta ei voitu tehdä PDF:stä tässä selaimessa. Valitse kansikuva erikseen.');
      return;
    }
    $('preview-text').textContent = 'Tehdään kansikuvaa…';
    file.arrayBuffer()
      .then(function (buf) { return pdfjsLib.getDocument({ data: buf }).promise; })
      .then(function (doc) { return doc.getPage(1); })
      .then(function (page) {
        var base = page.getViewport({ scale: 1 });
        var vp = page.getViewport({ scale: 1000 / base.width });
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(vp.width);
        canvas.height = Math.round(vp.height);
        return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise
          .then(function () {
            return new Promise(function (res) { canvas.toBlob(res, 'image/jpeg', 0.85); });
          });
      })
      .then(function (blob) {
        renderedCover = blob;
        if (!$('cover').files[0]) previewBlob(blob, 'Kansikuva tehdään PDF:n ensimmäisestä sivusta.');
      })
      .catch(function () {
        previewBlob(new Blob(), 'PDF:n ensimmäistä sivua ei saatu kansikuvaksi. Valitse kansikuva erikseen.');
      });
  });

  $('cover').addEventListener('change', function () {
    var f = $('cover').files[0];
    if (f) previewBlob(f, 'Kansikuvana käytetään valitsemaasi kuvaa.');
    else if (renderedCover) previewBlob(renderedCover, 'Kansikuva tehdään PDF:n ensimmäisestä sivusta.');
    else $('preview').hidden = true;
  });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var pdf = $('pdf').files[0];
    if (!pdf && !current()) {
      show($('result'), 'Valitse lehden PDF.', 'err');
      return;
    }
    var fd = new FormData();
    // Text fields first: the proxy reads the form as a stream.
    fd.append('year', $('year').value);
    fd.append('number', $('number').value);
    fd.append('title', $('title').value);
    var cover = $('cover').files[0];
    if (cover) fd.append('cover', cover, cover.name);
    else if (renderedCover) fd.append('cover', renderedCover, 'kansi.jpg');
    if (pdf) fd.append('pdf', pdf, pdf.name);

    var xhr = new XMLHttpRequest();
    xhr.open('POST', PROXY + '/proleko/issues');
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    $('submit').disabled = true;
    $('progress').hidden = false;
    $('progress').value = 0;
    show($('result'), pdf ? 'Ladataan…' : 'Tallennetaan…');
    xhr.upload.onprogress = function (ev) {
      if (ev.lengthComputable) $('progress').value = Math.round(100 * ev.loaded / ev.total);
    };
    xhr.onload = function () {
      $('submit').disabled = false;
      $('progress').hidden = true;
      var body = {};
      try { body = JSON.parse(xhr.responseText); } catch (x) {}
      if (xhr.status === 401) { signedOut('Kirjautuminen on vanhentunut. Kirjaudu uudelleen.'); return; }
      if (xhr.status !== 200) { show($('result'), body.error || ('Virhe ' + xhr.status), 'err'); return; }
      var r = $('result');
      show(r, body.message, 'ok');
      if (body.pr && !body.merged) {
        r.appendChild(document.createTextNode(' '));
        var a = document.createElement('a');
        a.href = body.pr; a.textContent = 'Muutos GitHubissa'; a.target = '_blank'; a.rel = 'noopener';
        r.appendChild(a);
      }
      $('pdf').value = ''; $('cover').value = ''; renderedCover = null; $('preview').hidden = true;
    };
    xhr.onerror = function () {
      $('submit').disabled = false;
      $('progress').hidden = true;
      show($('result'), 'Yhteys katkesi. Yritä uudelleen.', 'err');
    };
    xhr.send(fd);
  });

  var t = storedToken();
  if (t) signedIn(t);
})();
</script>
</body>
</html>
