baseURL = "https://prodeko.org/"
title = "Prodeko"
enableRobotsTXT = true

# The current site serves every page under /fi/ or /en/. Keeping that means
# existing addresses can be preserved rather than redirected.
defaultContentLanguage = "fi"
defaultContentLanguageInSubdir = true

# Tags and categories are not part of the content model.
disableKinds = ["taxonomy", "term", "rss"]

[markup.goldmark.renderer]
  # Editors paste embed snippets for ilmo, the gallery and the webshop.
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

# The infoscreen's slides as JSON, from data/infoscreen.yaml. One file per
# language at /fi/infoscreen.json and /en/infoscreen.json with the same
# content; the infoscreen reads the Finnish one.
[outputFormats.infoscreen]
  mediaType = "application/json"
  baseName = "infoscreen"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "infoscreen"]

[params]
  # Origin of the self-hosted GoatCounter that counts pageviews:
  # https://analytics.prodeko.org in the published site. Empty here on
  # purpose. The value is supplied by one step of the publish workflow, so a
  # fork, a pull request and the audit crawl all build a site that counts
  # nothing — the crawl matters most, because it loads every page in a real
  # browser and would otherwise post a hundred and ten pageviews per run.
  #
  # layouts/partials/analytics.html reads it and appends /count.js and /count.
  goatcounter = ""

# Deny by default. Hugo's own defaults let a template run a handful of
# executables, read the environment and fetch any https URL; this site needs
# none of that, and templates are the one place an edit turns into code at
# build time. 'none' is Hugo's keyword for an empty whitelist.
#
# The content editor's allowlist keeps this file out of reach, so the closure
# cannot be edited away from the outside.
[security]
  [security.exec]
    # No dart-sass, no postcss, no node, no git: the stylesheet is plain CSS
    # and .GitInfo is not used.
    allow = ['none']
    osEnv = ['none']
  [security.funcs]
    # Governs the getenv and os.Getenv template functions both. It does not
    # touch HUGO_* configuration overrides, so the publish workflow still
    # supplies the GoatCounter origin through HUGO_PARAMS_GOATCOUNTER.
    getenv = ['none']
  [security.http]
    # resources.GetRemote, and getJSON and getCSV where they still exist.
    # Everything the site renders is in the repository.
    methods = ['none']
    urls = ['none']
    mediaTypes = ['none']

[languages]
  [languages.fi]
    label = "Suomi"
    weight = 1
    contentDir = "content/fi"
  [languages.en]
    label = "English"
    weight = 2
    contentDir = "content/en"
