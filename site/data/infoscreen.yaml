# The slides on the guild room's infoscreen (github.com/Prodeko/infoscreen),
# shown in this order. layouts/home.infoscreen.json publishes them at
# /fi/infoscreen.json, which the infoscreen polls.
#
# Each slide is {title, body, image, highlight, link, until}. body is
# Markdown, image an /uploads/ path, highlight draws a frame around the slide,
# the optional link (a full URL) is shown as a QR code, and the optional until
# (YYYY-MM-DD) is the last day the slide is shown.
#
# countdowns are the sidebar's countdowns, each {title, at}; at is a date and
# time in Finnish time. layouts/home.infoscreencountdowns.json publishes them
# at /fi/infoscreen-countdowns.json. The screen shows the nearest one ahead.
slides:
  - title: Tervetuloa kiltahuoneelle
    body: Prodekon infoscreen hakee diat prodeko.org:sta.
    highlight: false
countdowns:
  - title: Vaalikokous 2
    at: 2026-11-09T16:30:00
