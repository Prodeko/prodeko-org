# The sidebar list of sibling pages, read by layouts/partials/section-nav.html.
# One ordered list per language; each entry is a section with a title, the
# page prefixes it covers, and its links.
#
# match lists the URL prefixes that open the section. The first entry whose
# prefix matches the page's path wins, so a subsection comes before the
# section that contains it: /fi/guild/hallitus-ja-toimihenkilot/ is listed
# above /fi/guild/.
#
# A page whose path matches nothing has no sidebar and reads full width.
#
# An item marked members: true names a page of the gated member tree, which
# the template prints as plain text in a build that carries no such tree.
#
# The Swedish pages live in the fi tree with /sv/ URLs of their own, so their
# section sits among the Finnish ones.
fi:
  - title: Hallitus ja toimarit
    match: [/fi/guild/hallitus-ja-toimihenkilot/]
    items:
      - { label: Hallitus ja toimihenkilöt, url: /fi/guild/hallitus-ja-toimihenkilot/ }
      - { label: Hallituksen toiminta, url: /fi/guild/hallitus-ja-toimihenkilot/hallituksen-toiminta/ }
      - { label: Toimarien toiminta, url: /fi/guild/hallitus-ja-toimihenkilot/toimarien-toiminta/ }
  - title: Kilta
    match: [/fi/guild/]
