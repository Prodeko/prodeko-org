# The mega-menu columns from raw-website/Prodeko-site.dc.html, keyed by the
# same menuKey used in data/navigation.yaml. Each link is {label, url}, and
# every entry names a page of this site or a service the guild runs: a menu
# item is a promise, and the menu only makes promises the site keeps. An
# entry marked members: true names a page of the gated member tree, which
# the template prints as plain text in a build that carries no such tree. An
# entry marked signedIn: true is shown to signed-in members only, in the
# member build, and left out of the public menu altogether.
# Links to ilmo/viikkotiedote/gallery/store/kululaskut reuse the base
# addresses in data/embeds.yaml.
