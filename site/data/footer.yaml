# Read by layouts/partials/footer.html. address and legal are shared by both
# languages; each language block holds the single Linkit column and the row of
# small print under it.
#
# The footer is where pages live that belong to no mega-menu section — the
# privacy notice, the service pages, the guild's own addresses — so anything
# added under site/content/ has an address a reader can reach from any page.
#
# The guild's contact details appear here and nowhere else on the site, apart
# from the asides of the pages that own them.
