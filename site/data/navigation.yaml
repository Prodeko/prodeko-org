# Read by layouts/partials/header.html. One list per language. URLs mirror
# the live prodeko.org exactly (both languages share the "guild" segment), so
# migrated content needs no redirects.
#
# menuKey names a key in data/megamenu.yaml: the header shows that item's
# columns in a mega-menu on hover/click.
#
# owns lists the page prefixes whose pages light this item in the bar. An item
# without owns lights on its own url alone.
#
# The phone menu opens an item with a menuKey into the same links as its
# mega-menu; an item without a menuKey is a direct link there.
#
# The bar names the five audiences the site speaks to, and Palvelut and
# Tapahtumat beside them: the services and the events are what a member comes
# back for week after week, so they have items of their own instead of hiding
# under Kilta. The calendar and the sign-up forms live in Ilmokilke; the
# Tapahtumat page introduces the guild's events and its menu leads there.
fi:
  - title: Kilta
    url: /fi/guild/
    menuKey: guild
    owns: [/fi/guild/, /fi/opinnot/]
  - title: Palvelut
    url: /fi/palvelut/
    menuKey: services
    owns: [/fi/palvelut/]
  - title: Tapahtumat
    url: /fi/tapahtumat/
    menuKey: events
  - title: Abeille
    url: /fi/abit/
    menuKey: prospective
    owns: [/fi/abit/, /sv/]
  - title: Yrityksille
    url: /fi/yrityssuhteet/
    menuKey: corporate
  - title: Alumneille
    url: /fi/alumni/
    menuKey: alumni
  - title: Fukseille
    url: /fi/new-students/
    menuKey: fuksit
  # ESTIEM LG Helsinki is a community of its own rather than one of the
  # guild's services, so it has a bar item instead of a row under Palvelut.
  - title: ESTIEM
    url: /fi/estiem-lg-helsinki/
    owns: [/fi/estiem-lg-helsinki/]

en:
  - title: Guild
    url: /en/guild/
    menuKey: guild
    owns: [/en/guild/, /en/studies/]
  - title: Services
    url: /en/services/
    menuKey: services
    owns: [/en/services/]
  - title: Events
    url: /en/events/
    menuKey: events
  - title: Prospective students
    url: /en/prospective-students/
    menuKey: prospective
  - title: Companies
    url: /en/yrityssuhteet/
    menuKey: corporate
  - title: Alumni
    url: /en/alumni/
    menuKey: alumni
  - title: New students
    url: /en/new-students/
    menuKey: fuksit
  - title: ESTIEM
    url: /en/estiem-lg-helsinki/
    owns: [/en/estiem-lg-helsinki/]
