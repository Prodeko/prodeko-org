# Decap configuration for the local dev stack only.
#
# repo and branch must match GITHUB_OWNER/GITHUB_REPO/GITHUB_BRANCH in .env.
# The proxy pins the repository server-side regardless, but a mismatch makes
# the editing screen describe a different repository than the one being
# written to, which is confusing to debug.
backend:
  name: github
  repo: prodeko/prodeko-org

  # A throwaway branch, never main. Saving here writes real commits and opens
  # real pull requests, and the proxy refuses any ref other than the one it is
  # pinned to, so a branch that does not match GITHUB_BRANCH fails on save.
  branch: cms-e2e

  # base_url must be a bare origin. Decap compares the popup's
  # window.postMessage event origin against this string exactly, and an event
  # origin never has a path, so a trailing slash or a /path here makes login
  # hang with no error. Same value as the proxy's PUBLIC_URL.
  base_url: http://localhost:8080
  auth_endpoint: auth
  api_root: http://localhost:8080/github

# There is no local_backend key here on purpose. Decap's local backend
# bypasses the proxy entirely, so testing with it exercises none of the login
# path while appearing to work.

# Saving opens a pull request instead of writing the branch, which is what the
# real site does. Without this there is no pull request, no workflow tab and no
# status labels, so the dev stack exercises a different path from production.
publish_mode: editorial_workflow

media_folder: site/static/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Pages
    label_singular: Page
    folder: site/content/fi
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
